
<mat-card class="curso-card">

  <mat-card-header>
    <mat-toolbar class="curso-toolbar">
      Detalhes do Curso
    </mat-toolbar>
  </mat-card-header>

  <mat-card-content>
    <form
      [formGroup]="form"
      class="min-width"
      (ngSubmit)="onSubmit()">

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Nome</mat-label>

        <input
          matInput
          formControlName="name"
          placeholder="Ex.: Angular com Spring"
          maxlength="100"
        />

        <mat-error *ngIf="form.get('name')?.invalid">
          {{ getErrorMessage('name') }}
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Categoria*</mat-label>

        <mat-select formControlName="category">
          <mat-option value="">Selecione</mat-option>
          <mat-option value="Front-end">Front-end</mat-option>
          <mat-option value="Back-end">Back-end</mat-option>
        </mat-select>

        <mat-error *ngIf="form.get('category')?.invalid">
          {{ getErrorMessage('category') }}
        </mat-error>
      </mat-form-field>

      <mat-toolbar appearance="fill" class="full-width">
        <span>Aulas</span>
        <button mat-icon-button color="accent" (click)="addNewLesson()">
          <mat-icon aria-label="Adicionar uma nova aula">add</mat-icon>
        </button>
      </mat-toolbar>

      <table style="width: 100%" formArrayName="lessons"
      *ngFor="let lesson of getLessonsFormArray(); let i = index"
      >
        <tr [formGroupName]="i">
          <td style="width: 65%">
            <mat-form-field appearance="fill" class="full-width">
              <mat-label>Nome da Aula</mat-label>
              <input matInput formControlName="name"/>
            </mat-form-field>
          </td>
          <td style="width: 30%">
            <mat-form-field appearance="fill" class="full-width">
              <mat-label>URL</mat-label>
              <span matPrefix>https://youtube.be/</span>
              <input matInput formControlName="youtubeUrl"/>
            </mat-form-field>
          </td>
          <td>
        <button mat-icon-button color="warning" (click)="removeLesson(i)">
          <mat-icon aria-label="Remover a aula">delete</mat-icon>
        </button>
          </td>
        </tr>
      </table>

      <mat-card-actions class="curso-actions">
        <button matButton="filled" type="submit">
          Salvar
        </button>

        <button
          matButton="tonal"
          type="button"
          (click)="onCancel()">
          Cancelar
        </button>
      </mat-card-actions>

    </form>
  </mat-card-content>

</mat-card>
