<mat-card>
  <mat-card-header>
    <mat-toolbar style="background-color: #3f51b5; color: white">
      Detalhes do curso
    </mat-toolbar>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="form" class="min-width" (ngSubmit)="onSubmit()">
      <mat-form-field class="full-width">
        <mat-label>Nome do curso</mat-label>
        <input
          matInput
          formControlName="name"
          placeholder="Ex.: Angular com Spring"
        />
        <mat-error *ngIf="form.get('name')?.invalid">
          {{ getErrorMessage('name') }}
        </mat-error>
      </mat-form-field>

      <mat-form-field class="full-width">
        <mat-label>Categoria</mat-label>
        <mat-select formControlName="category">
          <mat-option value="">Selecione</mat-option>
          <mat-option value="Front-end">Front-end</mat-option>
          <mat-option value="Back-end">Back-end</mat-option>
        </mat-select>
        <mat-error *ngIf="form.get('category')?.invalid">
          {{ getErrorMessage('category') }}
        </mat-error>
      </mat-form-field>

      <mat-card-actions>
        <button matButton="filled" type="submit">Salvar</button>
        <button matButton="tonal" type="button" (click)="onCancel()">Cancelar</button>
      </mat-card-actions>
    </form>
  </mat-card-content>
</mat-card>
